x-private-network: &private_network
  - app

x-api-build: &api_build
  context: .
  dockerfile: Dockerfile.api

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raiox
      POSTGRES_USER: raiox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raiox -d raiox"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: *private_network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: *private_network

  migrate:
    build: *api_build
    image: raiox-api:local
    environment: &python_environment
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no .env}
      REDIS_URL: ${REDIS_URL:?Defina REDIS_URL no .env}
      RAIOX_RATE_SECRET: ${RAIOX_RATE_SECRET:?Defina RAIOX_RATE_SECRET no .env}
      RAIOX_UPLOAD_DIR: ${RAIOX_UPLOAD_DIR:?Defina RAIOX_UPLOAD_DIR no .env}
    command: ["alembic", "-c", "alembic/alembic.ini", "upgrade", "head"]
    networks: *private_network
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: *api_build
    image: raiox-api:local
    environment: *python_environment
    volumes: &upload_mount
      - uploads:${RAIOX_UPLOAD_DIR:?Defina RAIOX_UPLOAD_DIR no .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks: *private_network

  worker:
    build: *api_build
    image: raiox-api:local
    environment: *python_environment
    volumes: *upload_mount
    command: ["python", "-m", "worker.queue"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    networks: *private_network

  limpeza:
    build: *api_build
    image: raiox-api:local
    environment: *python_environment
    volumes: *upload_mount
    command: ["sh", "-c", "while true; do python -m worker.limpeza; sleep 86400; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: *private_network

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_URL: ${API_URL:?Defina API_URL no .env}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
      - public

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  app:
    internal: true
  public:
