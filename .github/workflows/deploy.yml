name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    # O deploy de produção é do Coolify (compose.coolify.yaml). Este caminho por SSH só roda
    # quando a variable VPS_DEPLOY_PATH existir; sem ela, o job é pulado em vez de falhar.
    if: ${{ vars.VPS_DEPLOY_PATH != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
    steps:
      - name: Update the existing VPS checkout
        shell: bash
        run: |
          set -euo pipefail

          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS VPS_DEPLOY_PATH; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing deploy configuration::Set $name in repository secrets or variables before deploying." >&2
              exit 1
            fi
          done

          if [[ ! "$VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] ||
             [[ ! "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] ||
             [[ ! "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]] ||
             [[ "$VPS_DEPLOY_PATH" == *..* ]]; then
            echo "::error title=Invalid deploy configuration::Use a DNS name or IPv4 host, a simple SSH user, and an absolute VPS_DEPLOY_PATH without spaces or '..'." >&2
            exit 1
          fi

          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/id_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_key" "$ssh_dir/known_hosts"

          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -i "$ssh_dir/id_key" -l "$VPS_USER" "$VPS_HOST" \
            "cd -- '$VPS_DEPLOY_PATH' && git pull --ff-only origin main && docker compose up -d --build"
